name: Deploy front to GitHub Pages

on:
  push:
    branches: [main]
    paths: [front/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
        working-directory: front

      - run: npm run build
        working-directory: front
        env:
          # Repo Variable, not a secret — it ends up in the public JS bundle either
          # way. Settings → Secrets and variables → Actions → Variables.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      # GitHub Pages has no server-side rewrite for client-side routes: a direct load
      # or refresh on e.g. /album2vec would 404. Serving the same shell at 404.html
      # keeps the requested URL in the address bar and lets react-router take it from
      # there — same trick api/app.py's spa_fallback does for the Docker deployment.
      - run: cp dist/index.html dist/404.html
        working-directory: front

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
